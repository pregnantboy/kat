[package]
name = "killer"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
libproc = "0.15"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSRunLoop", "NSDate", "NSString", "NSArray", "NSEnumerator", "NSData", "NSDictionary", "NSGeometry", "NSURL"] }
ratatui = "0.30"
